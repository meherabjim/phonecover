<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice — Cravat Cases</title><meta name="robots" content="noindex"><link rel="icon" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><link rel="stylesheet" href="/css/style.css?v=7">
<style>
body{background:#ECE8E1}
.bar-i{position:sticky;top:0;z-index:5;background:var(--navy);padding:10px 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar-i .btn{padding:9px 16px}
.sheet{width:210mm;min-height:297mm;margin:24px auto;background:#fff;box-shadow:0 20px 50px -30px rgba(0,0,0,.4);padding:16mm 15mm;color:#1b1f28;font-size:13px;position:relative}
.ih{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:2px solid var(--navy)}
.ih .brand{display:flex;gap:12px;align-items:center}.ih .brand img{width:64px;height:64px;border-radius:50%}
.ih .brand b{font-family:var(--serif);font-size:26px;color:var(--navy);letter-spacing:.1em;display:block;line-height:1}
.ih .brand small{color:#6b6f7a;font-size:11.5px;line-height:1.5;display:block;margin-top:6px}
.ih .t{text-align:right}.ih .t h1{font-size:34px;letter-spacing:.14em;color:var(--gold-d);font-weight:600}
.ih .t div{font-size:12.5px;color:#4b5060;line-height:1.7}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}
.meta .box{border:1px solid #E8E2D6;border-radius:10px;padding:12px 14px;margin:0}
.meta h5{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:6px;font-weight:600}
.meta p{line-height:1.6}
table.it{width:100%;border-collapse:collapse;margin-top:6px}
table.it th{background:var(--navy);color:#fff;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 8px;text-align:left}
table.it th:first-child{border-radius:8px 0 0 8px}table.it th:last-child{border-radius:0 8px 8px 0;text-align:right}
table.it td{padding:10px 8px;border-bottom:1px solid #EFEAE0;vertical-align:middle}
table.it td.r,table.it th.r{text-align:right}
table.it img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#F1ECE3}
.sum{display:flex;justify-content:flex-end;margin-top:14px}
.sum table{width:280px;border-collapse:collapse}.sum td{padding:6px 8px}.sum td:last-child{text-align:right}
.sum .tot td{border-top:2px solid var(--navy);font-weight:700;font-size:16px;color:var(--navy);padding-top:10px}
.sum .due td{background:#FBEDE8;color:var(--sale);font-weight:600;border-radius:6px}
.note{margin-top:20px;padding:12px 14px;background:#F9F6F0;border-radius:10px;font-size:12.5px}
.foot-i{position:absolute;left:15mm;right:15mm;bottom:12mm;border-top:1px solid #E8E2D6;padding-top:10px;display:flex;justify-content:space-between;font-size:11.5px;color:#6b6f7a}
.stamp{display:inline-block;padding:3px 10px;border:1.5px solid currentColor;border-radius:6px;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media screen and (max-width:820px){.sheet{width:auto;min-height:0;margin:12px;padding:20px 16px 70px}.meta{grid-template-columns:1fr}.ih{flex-direction:column}.ih .t{text-align:left}table.it .hm{display:none}.foot-i{left:16px;right:16px;bottom:14px;flex-direction:column;gap:4px}}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar-i,.wa-float,.toast{display:none!important}.sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm}table.it .hm{display:table-cell}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="bar-i" id="bar"></div>
<div id="app"><p style="text-align:center;padding:60px">Loading invoice…</p></div>
<script src="/js/common.js?v=7"></script>
<script>
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  const h=Auth.headers();
  const [site,r]=await Promise.all([fetch('/api/site').then(r=>r.json()),fetch('/api/admin/orders/'+encodeURIComponent(id),{headers:h})]);
  SITE=site;const s=site.settings;
  if(r.status===401)return location.href='/login?next='+encodeURIComponent(location.pathname+location.search);
  if(!r.ok){$('#app').innerHTML='<p style="text-align:center;padding:60px">Invoice not found. <a href="/admin#orders">Back to orders</a></p>';return;}
  const o=await r.json(),c=o.customer||{};
  const sub=o.items.reduce((a,i)=>a+i.price*i.qty,0),paid=o.paid||0,due=Math.max(0,o.total-paid);
  const date=new Date(o.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  document.title=`Invoice ${o.no} — ${c.name||'Customer'}`;
  const addr=[c.address,c.thana,c.district].filter(Boolean).join(', ');
  const stColor={new:'#8A5A00',confirmed:'#1D4ED8',shipped:'#5B3CC4',delivered:'#1F7A4D',cancelled:'#B3261E'}[o.status]||'#555';
  $('#app').innerHTML=`<div class="sheet">
    <div class="ih"><div class="brand"><img src="${esc(s.logo)}" alt=""><div><b>${esc(s.siteName.toUpperCase())}</b><small>${esc(s.address)}<br>${esc(s.phone)} · ${esc(s.email)}</small></div></div>
      <div class="t"><h1>INVOICE</h1><div>Invoice no: <b>${esc(o.no)}</b><br>Date: ${date}<br>Status: <span class="stamp" style="color:${stColor}">${esc(o.status)}</span></div></div></div>
    <div class="meta">
      <div class="box"><h5>Bill to</h5><p><b>${esc(c.name||'—')}</b><br>${c.phone?esc(c.phone)+'<br>':''}${addr?esc(addr)+'<br>':''}${c.area==='outside'?'Outside Dhaka':'Inside Dhaka'}</p></div>
      <div class="box"><h5>Payment</h5><p>${esc(o.payment||'Cash on delivery')}<br>Order via: ${o.source==='manual'?'Direct / phone':'Website · WhatsApp'}${o.coupon?`<br>Coupon: ${esc(o.coupon)}`:''}</p></div>
    </div>
    <table class="it"><thead><tr><th>#</th><th class="hm"></th><th>Product</th><th>Model</th><th class="hm">Colour</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th></tr></thead>
      <tbody>${o.items.map((i,n)=>`<tr><td>${n+1}</td><td class="hm">${i.image?`<img src="${esc(i.image)}" alt="">`:''}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.model||'—')}</td><td class="hm">${esc(i.color||'—')}</td><td class="r">${i.qty}</td><td class="r">${money(i.price)}</td><td class="r">${money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table>
    <div class="sum"><table>
      <tr><td>Subtotal</td><td>${money(sub)}</td></tr>
      ${o.discount?`<tr><td>Discount</td><td>−${money(o.discount)}</td></tr>`:''}
      <tr><td>Delivery charge</td><td>${money(o.delivery)}</td></tr>
      <tr class="tot"><td>Total</td><td>${money(o.total)}</td></tr>
      ${paid?`<tr><td>Paid</td><td>${money(paid)}</td></tr>`:''}
      <tr class="due"><td>${due?'Amount due':'Fully paid'}</td><td>${money(due)}</td></tr>
    </table></div>
    ${c.note?`<div class="note"><b>Note:</b> ${esc(c.note)}</div>`:''}
    <div class="note" style="background:none;border:1px dashed #E8E2D6">${s.slogan?`<b>${esc(s.slogan)}</b> `:''}Thank you for shopping with ${esc(s.siteName)}! Please check your case on delivery. For any help, WhatsApp us at ${esc(s.phone)}.</div>
    <div class="foot-i"><span>${esc(s.siteName)} · ${esc(s.tagline||'')}</span><span>${esc(o.no)} · Generated ${new Date().toLocaleDateString('en-GB')}</span></div>
  </div>`;
  const ph=(c.phone||'').replace(/\D/g,'');const wa=ph?`https://wa.me/${ph.startsWith('880')?ph:'88'+ph.replace(/^88/,'')}?text=`+encodeURIComponent(`Hello ${c.name||''}! Your ${s.siteName} invoice ${o.no}:\n\n${o.items.map(i=>`• ${i.name} (${i.model}, ${i.color}) × ${i.qty} — ${money(i.price*i.qty)}`).join('\n')}\n\nDelivery: ${money(o.delivery)}${o.discount?`\nDiscount: −${money(o.discount)}`:''}\n*Total: ${money(o.total)}*${paid?`\nPaid: ${money(paid)}\nDue: ${money(due)}`:''}\n\nThank you for shopping with us!`):'';
  $('#bar').innerHTML=`<a class="btn light" href="/admin#orders">← Admin</a><button class="btn gold" id="pdf">Download PDF</button>${wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">${ICON.wa} Send to customer</a>`:''}`;
  $('#pdf').onclick=()=>{toast('Choose “Save as PDF” as the printer');setTimeout(()=>print(),300);};
  if(new URLSearchParams(location.search).get('print')==='1')setTimeout(()=>print(),600);
})();
</script></body></html>
